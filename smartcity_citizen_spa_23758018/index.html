<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Citizen Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
    background: linear-gradient(
        135deg,
        #f4f8ff,
        #eef5ff
    );
    min-height: 100vh;
}

.navbar {
    backdrop-filter: blur(10px);
}

.hero-title {
    font-size: 3rem;
    font-weight: 800;
    color: #0d6efd;
}

.hero-subtitle {
    font-size: 1.1rem;
    color: #6c757d;
    line-height: 1.8;
}

.login-card {
    border: none;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.08);
}

.form-control {
    border-radius: 12px;
    padding: 12px;
}

.btn-primary {
    border-radius: 12px;
}

.hero-icon {
    font-size: 8rem;
    color: #0d6efd;
    opacity: .15;
}

.feature-item {
    background: white;
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

footer {
    font-size: 14px;
}

        .navbar-brand {
            font-weight: bold;
        }

        .spa-container {
            min-height: calc(100vh - 80px);
        }

        .card {
            border-radius: 16px;
        }

        .btn {
             border-radius: 10px;
        }

        .report-card {
            transition: 0.3s;
        }

        .report-card:hover {
            transform: translateY(-3px);
        }

        .sidebar-card {
            position: sticky;
            top: 20px;
        }

        .status-item {
            padding: 10px;
            border-radius: 10px;
            background: #f8f9fa;
            margin-bottom: 8px;
        }

        .min-vh-75{
            min-height:75vh;
        }

        .hero-title{
            font-size:3.5rem;
            font-weight:800;
            color:#0d6efd;
        }

        .hero-subtitle{
            font-size:1.15rem;
            color:#6c757d;
            line-height:1.8;
        }

        .login-card{
            border:none;
            border-radius:24px;
            box-shadow:0 20px 50px rgba(0,0,0,.08);
        }

        .feature-item{
            background:white;
            padding:14px 18px;
            border-radius:14px;
            margin-bottom:12px;
            box-shadow:0 5px 20px rgba(0,0,0,.05);
        }
        .navbar-brand small{
    display:block;
    line-height:1.2;
}

.navbar{
    backdrop-filter:blur(10px);
}

.navbar-brand{
    letter-spacing:.3px;
}

.stat-card{
    border:none;
    border-radius:20px;
    overflow:hidden;
    transition:.3s;
    box-shadow:
        0 10px 25px
        rgba(0,0,0,.05);
}

.stat-card:hover{
    transform:
        translateY(-5px);
}

.stat-icon{
    width:60px;
    height:60px;
    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:1.7rem;
}

.stat-number{
    font-size:2rem;
    font-weight:700;
}

.stat-label{
    color:#6c757d;
    font-size:.9rem;
}
.status-card{

    background:#f8fafc;

    border-radius:14px;

    padding:14px 16px;

    transition:.3s;

    border:1px solid #eef2f7;

}

.status-card:hover{

    background:#ffffff;

    transform:translateX(4px);

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.05);

}
.sidebar-premium{

    border-radius:24px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.08);

}
.dashboard-card{

    border-radius:24px;

    overflow:hidden;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.06);

}
.btn-primary{

    transition:.3s;

}

.btn-primary:hover{

    transform:
        translateY(-2px);

}
    </style>
</head>
<body>

    <nav
    class="navbar navbar-expand-lg navbar-dark shadow-sm"
    style="
        background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );
    ">

    <div class="container">

        <a
            class="navbar-brand d-flex align-items-center"
            href="#">

            <i
                class="bi bi-buildings-fill fs-3 me-3">
            </i>

            <div>

                <div
                    class="fw-bold">

                    IET City Portal

                </div>

                <small
                    style="
                        font-size:11px;
                        opacity:.8;
                    ">

                    Smart City Citizen Reporting System

                </small>

            </div>

        </a>

        <div id="nav-menu"></div>

    </div>

</nav>

    <main class="container-fluid mt-4 spa-container" id="app-content">
        Loading...
    </main>

    <!-- REPORT MODAL -->
    <div class="modal fade" id="reportModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Buat / Edit Laporan
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <form id="reportForm">

                        <div class="mb-3">
                            <label class="form-label">
                                Judul Laporan
                            </label>

                            <input
                                type="text"
                                id="reportTitle"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Kategori
                            </label>

                            <input
                                type="text"
                                id="reportCategory"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Deskripsi
                            </label>

                            <textarea
                                id="reportDescription"
                                class="form-control"
                                rows="4"
                                required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Lokasi
                            </label>

                            <input
                                type="text"
                                id="reportLocation"
                                class="form-control"
                                required>
                        </div>

                        <div class="d-flex justify-content-between">

                            <button
                                type="button"
                                id="btnDraft"
                                class="btn btn-secondary">
                                Simpan Draft
                            </button>

                            <button
                                type="button"
                                class="btn btn-primary"
                                id="btnSubmitReport">
                                Ajukan
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- JS PROJECT -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<footer class="bg-white border-top mt-5 py-3">

    <div class="container text-center">

        <small class="text-muted">

            © 2026 IET City Portal |
            Smart City Citizen Reporting System

        </small>

    </div>

</footer>
</body>
</html>
