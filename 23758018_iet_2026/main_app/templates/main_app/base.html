{% load static %}
<!DOCTYPE html>
<html>
<head>

<title>CivicTrack - Smart City Issue Reporting</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;

background-image:url("{% static 'images/city.jpg' %}");
background-size:cover;
background-position:center;
background-attachment:fixed;

display:flex;
flex-direction:column;
min-height:100vh;
}

/* DARK OVERLAY */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:-1;
}

/* NAVBAR */

.navbar{
background:rgba(0,0,0,0.35);
backdrop-filter:blur(6px);
padding:18px;
display:flex;
justify-content:center;
}

.navbar a{
color:white;
text-decoration:none;
margin:0 25px;
font-size:18px;
font-weight:bold;
}

.navbar a:hover{
color:#f39c12;
}

/* CONTENT */

.container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

/* GLASS CARD */

.card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

padding:40px;
width:65%;

border-radius:15px;
border:1px solid rgba(255,255,255,0.25);

color:white;

box-shadow:0 8px 32px rgba(0,0,0,0.35);
}

.card h1,
.card h2,
.card h3{
color:white;
}

/* FOOTER */

footer{
background:rgba(0,0,0,0.5);
text-align:center;
color:white;
padding:15px;
}

</style>

</head>

<body>

<div class="navbar">

<a href="/">Home</a>
<a href="/about/">About</a>
<a href="/contacts/">Contact</a>

</div>

<div class="container">

<div class="card">

{% block content %}
{% endblock %}

</div>

</div>

<footer>

© 2026 CivicTrack Smart City System

</footer>

</body>
</html>
