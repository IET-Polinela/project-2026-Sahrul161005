<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CivicTrack</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        :root {
            --bs-primary: #185FD6;
            --bs-primary-rgb: 24, 95, 214;
        }

        body {
            background-color: #f5f7fa;
        }

        .navbar.navbar-dark.bg-dark {
            background-color: #185FD6 !important;
        }

        .btn-primary,
        .bg-primary,
        .badge.bg-primary,
        .card-header.bg-primary {
            background-color: #185FD6 !important;
            border-color: #185FD6 !important;
        }

        .btn-primary:hover,
        .bg-primary:hover,
        .badge.bg-primary:hover,
        .card-header.bg-primary:hover {
            background-color: #144fb0 !important;
            border-color: #144fb0 !important;
        }

        .text-primary {
            color: #185FD6 !important;
        }

        .table-responsive {
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(24, 95, 214, 0.12);
            box-shadow: 0 10px 30px rgba(24, 95, 214, 0.08);
        }

        .table {
            border-collapse: separate;
            border-spacing: 0;
            background-color: #ffffff;
        }

        .table thead th {
            background: linear-gradient(135deg, #185FD6 0%, #3B80F7 100%);
            color: #ffffff;
            border: none;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .table tbody tr {
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .table tbody tr:hover {
            background-color: rgba(24, 95, 214, 0.08);
            transform: translateX(2px);
        }

        .table td,
        .table th {
            border-top: 1px solid rgba(24, 95, 214, 0.12);
            vertical-align: middle;
            padding: 0.65rem 0.75rem;
            font-size: 0.95rem;
        }

        .table.table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(24, 95, 214, 0.04);
        }

        .table-striped-columns tbody tr:hover > *:nth-child(odd) {
            background-color: rgba(24, 95, 214, 0.08);
        }

        .table tbody tr:last-child td {
            border-bottom: none;
        }

        .table td .btn,
        .table td .badge {
            min-width: 3rem;
        }
    </style>

</head>

<body style="background-color:#f5f7fa;">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌆 CivicTrack</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about/">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/contacts/">Contact</a>
                </li>

                <li class="nav-item ms-2">
                    <a href="/add/" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Report
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ALERT -->
<div class="container mt-3">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success alert-dismissible fade show shadow-sm">
                {{ message }}
                <button class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>

<!-- CONTENT -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<!-- FOOTER -->
<footer class="text-center mt-5 mb-3 text-muted">
    © 2026 CivicTrack Smart City System
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
