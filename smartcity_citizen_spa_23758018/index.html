<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Citizen Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
    background-color: #f8f9fa;
    min-height: 100vh;
}

footer {
    font-size: 14px;
}

        .navbar-brand {
            font-weight: bold;
        }

        .spa-container {
            min-height: calc(100vh - 80px);
        }

        .card {
            border-radius: 16px;
        }

        .btn {
             border-radius: 10px;
        }

        .report-card {
            transition: 0.3s;
        }

        .report-card:hover {
            transform: translateY(-3px);
        }

        .sidebar-card {
            position: sticky;
            top: 20px;
        }

        .status-item {
            padding: 10px;
            border-radius: 10px;
            background: #f8f9fa;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark shadow-sm"
     style="background: linear-gradient(90deg,#0d6efd,#0b5ed7);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-building me-2"></i>
                IET City Portal
            </a>    

            <div id="nav-menu"></div>
        </div>
    </nav>

    <main class="container-fluid mt-4 spa-container" id="app-content">
        Loading...
    </main>

    <!-- REPORT MODAL -->
    <div class="modal fade" id="reportModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Buat / Edit Laporan
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <form id="reportForm">

                        <div class="mb-3">
                            <label class="form-label">
                                Judul Laporan
                            </label>

                            <input
                                type="text"
                                id="reportTitle"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Kategori
                            </label>

                            <input
                                type="text"
                                id="reportCategory"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Deskripsi
                            </label>

                            <textarea
                                id="reportDescription"
                                class="form-control"
                                rows="4"
                                required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Lokasi
                            </label>

                            <input
                                type="text"
                                id="reportLocation"
                                class="form-control"
                                required>
                        </div>

                        <div class="d-flex justify-content-between">

                            <button
                                type="button"
                                id="btnDraft"
                                class="btn btn-secondary">
                                Simpan Draft
                            </button>

                            <button
                                type="button"
                                class="btn btn-primary"
                                id="btnSubmitReport">
                                Ajukan
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- JS PROJECT -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<footer class="bg-white border-top mt-5 py-3">

    <div class="container text-center">

        <small class="text-muted">

            © 2026 IET City Portal |
            Smart City Citizen Reporting System

        </small>

    </div>

</footer>
</body>
</html>
